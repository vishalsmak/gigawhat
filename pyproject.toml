[project]
name = "gigawhat"
version = "0.1.0"
description = "Operational assistant for a regulated gas and electricity utility: trusted procedures, cited evidence and suggested next steps under human oversight."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vishal Smak", email = "vishal.smak214@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "docling>=2.137.0",
    "httpx>=0.28.1",
    "langchain-cohere>=0.6.0",
    "langchain-core>=1.6.9",
    "langchain-docling>=3.0.0",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.19",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "typer>=0.19",
]

[project.scripts]
gigawhat = "gigawhat.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
# The breadcrumb separator in section paths, e.g. "6 Procedure › 6.2 Nitrogen purge".
allowed-confusables = ["›"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the Postgres container (docker compose up -d db)",
    "slow: loads Docling and a tokenizer; takes seconds rather than milliseconds",
]

[tool.uv]
# Apple Silicon for development, Linux (x86_64 CI, arm64 EC2) for CI and hosting.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
