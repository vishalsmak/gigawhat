[project]
name = "gigawhat"
version = "0.1.0"
description = "Operational assistant for a regulated gas and electricity utility: trusted procedures, cited evidence and suggested next steps under human oversight."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vishal Smak", email = "vishal.smak214@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "chainlit>=2.12.0",
    "en-core-web-md",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-cohere>=0.6.0",
    "langchain-core>=1.6.9",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.19",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "nemoguardrails>=0.24.1",
    "pgvector>=0.3.6",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "typer>=0.19",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Loading documents: Docling and its PDF layout models (PyTorch). Not needed to serve answers.
ingest = ["docling>=2.137.0", "langchain-docling>=3.0.0"]
# The offline profile's local reranker (PyTorch). The cloud profile reranks with Cohere.
offline = ["sentence-transformers>=6.1.0"]

[project.scripts]
gigawhat = "gigawhat.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepeval>=4.2.8",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
# The breadcrumb separator in section paths, e.g. "6 Procedure › 6.2 Nitrogen purge".
allowed-confusables = ["›"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "scripts"]

untyped_calls_exclude = ["presidio_anonymizer", "chainlit", "deepeval"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "nemoguardrails.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# DeepEval's plugin loads .env into the environment; evaluations run from our own CLI instead.
addopts = "-ra --strict-markers -p no:deepeval"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Postgres container (docker compose up -d db)",
    "slow: loads Docling and a tokenizer; takes seconds rather than milliseconds",
]

[tool.uv]
# Apple Silicon for development, Linux (x86_64 CI, arm64 EC2) for CI and hosting.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
