name: Evaluation

# The full golden and red-team evaluation on the cloud profile, with DeepEval judging answers.
# Run by hand before a release; it spends API credit. Fails if any release gate fails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gigawhat
          POSTGRES_PASSWORD: gigawhat
          POSTGRES_DB: gigawhat_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gigawhat -d gigawhat_cloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GIGAWHAT_PROFILE: cloud
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --all-extras
      - run: uv run gigawhat db upgrade
      - run: uv run gigawhat data fetch-hse
      - run: uv run gigawhat data ingest
      - run: uv run gigawhat data load-records
      - run: uv run gigawhat eval run --suite golden --suite redteam --judge --concurrency 4
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-report
          path: evals/reports/
