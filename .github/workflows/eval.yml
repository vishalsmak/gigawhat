name: Evaluation

# The full golden and red-team evaluation on the cloud profile. Run by hand before a release;
# fails if any release gate fails. On Gemini's free tier a run uses about half of each chat
# model's daily quota, so it runs one case at a time and without the DeepEval judge. With the
# LangSmith secret set, the run is also recorded as a LangSmith experiment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gigawhat
          POSTGRES_PASSWORD: gigawhat
          POSTGRES_DB: gigawhat_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gigawhat -d gigawhat_cloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GIGAWHAT_PROFILE: cloud
      GIGAWHAT_RERANKER: local
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      # The key's region; empty means the EU default.
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --all-extras
      - run: uv run gigawhat db upgrade
      - run: uv run gigawhat data fetch-hse
      - run: uv run gigawhat data ingest
      - run: uv run gigawhat data load-records
      - run: uv run gigawhat eval run --suite golden --suite redteam
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-report
          path: evals/reports/
