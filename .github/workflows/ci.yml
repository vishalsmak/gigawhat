name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gigawhat
          POSTGRES_PASSWORD: gigawhat
          POSTGRES_DB: gigawhat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gigawhat -d gigawhat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GIGAWHAT_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
