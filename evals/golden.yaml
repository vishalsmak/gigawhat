# GigaWhat golden evaluation set (fictional Harrowmere Energy data).
#
# Each case is checked against data/corpus (procedures and register) and
# data/records (incidents, inspections, work orders, alarms). References quote
# section numbers from the current approved version unless stated otherwise.
#
# must_cite:     at least one of these doc IDs must appear among the sources ([] = no check)
# must_not_cite: forbidden sources: DOC (any version) or DOC@vN (one version)
# notices:       overdue_review | conflict | superseded_exists
#
# "Today" for these cases is 2026-10-10.

cases:
  # ---------------------------------------------------------------- strict (opening example)
  - id: G001
    question: "How high must the vent stack be when purging a PE main?"
    persona: gas_field_engineer
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-GAS-031]
    must_not_cite: [PR-GAS-031@v2]
    notices: []
    reference: >
      PR-GAS-031 v3 6.2.2: the vent stack outlet must be at least 2.5 m above ground level and point
      vertically upwards; 6.2.3 sets a 5 m exclusion zone kept free of ignition sources, vehicles and
      members of the public. Superseded v2 said 2 m and 3 m.
    why: Superseded v2 has a different, now-wrong height.

  # ---------------------------------------------------------------- routine
  - id: G002
    question: "who owns PR-ELEC-044 and when's it next due for review?"
    persona: electricity_control_room
    tier: routine
    behaviour: answer
    must_cite: [PR-ELEC-044]
    must_not_cite: []
    notices: []
    reference: >
      PR-ELEC-044 (Transformer Oil Sampling and Dissolved Gas Analysis) is owned by the Head of
      Electricity Network Operations. Version 3 was approved by the Senior Authorised Person (HV),
      took effect on 2025-04-01 and is due for review on 2028-04-01.
    why: Basic register and document-header lookup.

  - id: G003
    question: "How often do the secondary subs, ESS-BRK and ESS-ORC, need inspecting?"
    persona: electricity_control_room
    tier: routine
    behaviour: answer
    must_cite: [PR-ELEC-052]
    must_not_cite: []
    notices: [overdue_review]
    reference: >
      PR-ELEC-052 v4 6.1: secondary substations ESS-BRK and ESS-ORC are inspected quarterly, each
      within 7 days either side of the due date (6.1.1), with an extra inspection after severe weather,
      flooding, a reported intrusion or a transformer temperature alarm (6.1.2). PR-ELEC-052 v4 was due
      for review on 2026-06-30 and is past its review date, which the answer must say.
    why: Deliberate overdue-review case; the answer is still given but must carry the notice.

  - id: G004
    question: "wots the difference between OPSO and UPSO on a slam shut?"
    persona: gas_field_engineer
    tier: routine
    behaviour: answer
    must_cite: [PR-GAS-014, PR-GAS-010]
    must_not_cite: []
    notices: []
    reference: >
      PR-GAS-014 §4 (also PR-GAS-010 §4): OPSO, over-pressure shut-off, is the trip that closes the
      slam-shut if the sensed pressure rises above its setting; UPSO, under-pressure shut-off, closes it
      if the pressure falls below its setting. The GPR-HRW slam-shuts SSV-HRW-A and SSV-HRW-B have no
      UPSO (PR-GAS-014 6.1 and 6.4 NOTE).
    why: Abbreviation lookup with a typo.

  - id: G005
    question: "how do i report a near miss and how long have i got to do it?"
    persona: gas_field_engineer
    tier: routine
    behaviour: answer
    must_cite: [PR-CORP-001]
    must_not_cite: []
    notices: []
    reference: >
      PR-CORP-001 v5: tell the Gas Network Controller straight away (6.1.3), then enter the report in the
      incident reporting system within the timescale for its severity (6.2.1, section 4): low by the end
      of the next working day, medium within 24 hours, high within 4 hours; a near miss that could have
      caused serious injury or death is medium, and if unsure use the higher severity. A late report is
      better than none (6.2 NOTE).
    why: Company-wide procedure visible to every persona.

  - id: G006
    question: "how often does the Station Rd cast iron main get leak surveyed?"
    persona: gas_field_engineer
    tier: routine
    behaviour: answer
    must_cite: [PR-GAS-045]
    must_not_cite: []
    notices: []
    reference: >
      PR-GAS-045 v2 6.1: MAIN-LP-22 (Station Road, cast iron, 1932) is surveyed every 6 months plus a
      frost survey, carried out within 48 hours after the ground has been frozen for 3 or more
      consecutive days. Version 2 reduced the interval from 12 to 6 months and added the frost survey.
    why: Needs the main to be identified from a loose description.

  - id: G007
    question: "On my own at GPR-STN tonight doing peak pressure readings on G-118. What check-in interval do I need?"
    persona: gas_field_engineer
    tier: routine
    behaviour: answer
    must_cite: [PR-CORP-004]
    must_not_cite: []
    notices: []
    reference: >
      PR-CORP-004 v3 6.3.2: check in at least every 30 minutes for all lone work out of hours (18:00 to
      07:00 on weekdays, §4) and at no-signal sites, and also on arrival, on leaving and at book-off
      (6.3.3). GPR-STN was added to the gas no-signal site list after INC-2026-005, when a lone First
      Call Operative there missed two check-ins with no signal inside the governor house; 6.2.3 then
      requires a site landline, radio, satellite-enabled device or a second person.
    why: Combines a procedure with an incident record (no-signal site).

  - id: G008
    question: "whats a CME and who puts it on?"
    persona: electricity_control_room
    tier: routine
    behaviour: answer
    must_cite: [PR-ELEC-012]
    must_not_cite: [PR-ELEC-012@v3]
    notices: []
    reference: >
      PR-ELEC-012 v4 §4: a Circuit Main Earth (CME) is an earth applied at a point of isolation by an
      Authorised Person (HV) before a permit is issued and left in place until the permit is cancelled.
      An Additional Earth is applied at the point of work by the Competent Person (HV) after the permit
      is issued.
    why: Abbreviation lookup; must come from the current version, not superseded v3.

  - id: G009
    question: "One of the CPs has lost his op key somewhere at ESS-KGM. Who needs telling and how quick?"
    persona: electricity_control_room
    tier: routine
    behaviour: answer
    must_cite: [PR-ELEC-063]
    must_not_cite: []
    notices: []
    reference: >
      PR-ELEC-063 v3 6.5.1: report a lost or stolen operational key to the Control Engineer and the
      Electricity Safety Manager as soon as it is noticed, and within 24 hours at most; the Electricity
      Safety Manager decides whether locks at the affected sites must be changed (6.5.2), and the loss
      is reported under PR-CORP-001 (6.5.4) as a security event, medium severity. In INC-2024-006 a lost
      key led to lock cylinders being changed at all five substations.
    why: Admin lookup with an incident precedent.

  - id: G010
    question: "Which of our approved procedures are past their review date?"
    persona: document_controller
    tier: routine
    behaviour: answer
    must_cite: [PR-ELEC-052]
    must_not_cite: []
    notices: [overdue_review]
    reference: >
      Only PR-ELEC-052 v4 (Routine Substation Inspection, owner Head of Electricity Network Operations)
      is past its review date: it was due on 2026-06-30. Every other current approved version has a
      later review date, the earliest being PR-GAS-052 v4 on 2027-02-05. Superseded and withdrawn
      versions are not counted.
    why: Document controller persona; register-wide overdue check.

  - id: G011
    question: "which version of PR-GAS-031 is live and since when?"
    persona: document_controller
    tier: routine
    behaviour: answer
    must_cite: [PR-GAS-031]
    must_not_cite: [PR-GAS-031@v2]
    notices: [superseded_exists]
    reference: >
      PR-GAS-031 v3 is the approved version, effective 2026-04-01, approved by the Gas Safety Manager,
      review due 2029-04-01. Version 2 (effective 2022-07-01) is superseded.
    why: Version-status question; the superseded version exists and should be flagged but not cited.

  - id: G012
    question: "How are cancelled permits audited in gas and in electricity?"
    persona: auditor
    tier: routine
    behaviour: answer
    must_cite: [PR-GAS-021, PR-ELEC-020]
    must_not_cite: []
    notices: []
    reference: >
      Gas: the Gas Safety Manager audits at least 10% of cancelled permits each month (PR-GAS-021 v5 §5)
      and monthly results go to the Head of Gas Network Operations (§7). Electricity: the Senior
      Authorised Person (HV) audits at least five cancelled safety documents each month and the
      Electricity Safety Manager reviews audit findings each quarter (PR-ELEC-020 v7 §5, §7).
    why: Auditor persona sees both units and should cite both.

  - id: G013
    question: "is PR-GAS-071 still the procedure for gas in buildings?"
    persona: gas_field_engineer
    tier: routine
    behaviour: answer
    must_cite: [PR-GAS-003]
    must_not_cite: [PR-GAS-071]
    notices: []
    reference: >
      No. PR-GAS-071 is withdrawn. PR-GAS-003 v8 (effective 2025-10-01) brought the gas-in-buildings
      checks back into PR-GAS-003 as 6.5 (checks inside) and 6.6 (tracing the external source); the
      NOTE at 6.5 and the v8 revision history say these replace PR-GAS-071.
    why: Deliberate withdrawn case; must point to PR-GAS-003 and not use PR-GAS-071.

  # ---------------------------------------------------------------- safety relevant
  - id: G014
    question: "whats the DGA trend on T-104 looking like? is the acetylene still climbing?"
    persona: electricity_control_room
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-ELEC-044]
    must_not_cite: []
    notices: []
    reference: >
      Acetylene in T-104 (ESS-ASH) was 0.0 ppm in Oct 2024 and Jan 2025, then 0.4 (Apr 2025), 0.6
      (Jul 2025), 0.9 (Oct 2025), 1.4 (Jan 2026), 2.6 on 2026-04-20 (above the 2 ppm caution threshold,
      PR-ELEC-044 6.5), 4.1 (Jul 2026), 4.6 (Aug 2026) and 5.8 on 2026-09-08 (above the 5 ppm action
      threshold, INC-2026-029), then 6.1, 6.5 and 6.9 ppm in the weekly samples to 2026-09-29; hydrogen
      rose from about 13 to 83 ppm, still below caution. Under 6.6.4 this means weekly sampling, an
      engineering review within 5 working days and load limited to the ONAN rating; 6.6.5 escalates
      at over 15 ppm or a rise of more than 3 ppm between samples.
    why: Deliberate T-104 trend; must connect records to both thresholds.

  - id: G015
    question: "T-104's over the C2H2 action level. What does 044 want us to do and where are we up to?"
    persona: electricity_authorised_person
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-ELEC-044]
    must_not_cite: []
    notices: []
    reference: >
      PR-ELEC-044 6.6.4: acetylene above 5 ppm means weekly sampling, an engineering review within 5
      working days and asking the Control Engineer to limit load to the ONAN rating until the review is
      complete; 6.6.5 refers it at once to the Senior Authorised Person (HV) above 15 ppm or on a rise of
      more than 3 ppm between samples. Records: INC-2026-029 (open) limited T-104 to 12 MVA ONAN with
      weekly sampling; engineering review WO-00071 was completed on 2026-09-14 and found probable arcing
      at the tap changer selector; outage WO-00075 for internal inspection is open, due 2026-11-27.
    why: Needs procedure actions plus work order status; uses the chemical formula for acetylene.

  - id: G016
    question: "G-112 logger max keeps coming up high overnight again. Is this the same thing as the slam shut trip back in March?"
    persona: gas_field_engineer
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-GAS-058]
    must_not_cite: []
    notices: []
    reference: >
      PR-GAS-058 6.4.3 flags any logger maximum more than 5 mbar above the 35 mbar set point. Monthly
      checks flagged 43.7, 46.2 and 47.6 mbar in Jan to Mar 2026, OUTLET_HIGH alarms followed on 1 to 9
      March (43.4 to 46.6 mbar), and SSV-112 tripped at 60.4 mbar on 10 March, cutting supply to 340
      properties (INC-2026-011; worn main valve seat replaced, WO-00053). After normal readings in Apr
      to Jun the flags returned (42.4, 45.2, 46.2 mbar in Jul to Sep) with overnight alarms in Aug and
      Sep and a 51 mbar peak on 17 Aug, above the 47 mbar creep relief but below the 60 mbar trip
      (INC-2026-027, open; WO-00062 in progress), so the pattern matches the run-up to the March trip.
    why: Deliberate G-112 pressure creep; must link logger readings, alarms and both incidents.

  - id: G017
    question: "When was SSV-112 last function tested and has it ever tripped in service?"
    persona: gas_authorised_person
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-GAS-014]
    must_not_cite: []
    notices: []
    reference: >
      PR-GAS-014 6.1: SSV-112 OPSO 60 mbar plus or minus 2.5, UPSO 12 mbar plus or minus 2, tested every
      12 months and after any repair, adjustment or unplanned trip (§2). Annual tests passed on
      2024-10-10 (OPSO 60.8, UPSO 12.5 mbar) and 2025-10-10 (60.1, 12.9 mbar). It tripped in service at
      60.4 mbar on 2026-03-10 (INC-2026-011) and was function-tested before G-112 returned to service,
      and again (passed) after the August creep (INC-2026-027). The last recorded annual test was
      2025-10-10, so the 12-monthly test falls due in October 2026.
    why: Inspection, alarm and incident records against the procedure's settings.

  - id: G018
    question: "what changed in PR-GAS-031 v3 and why?"
    persona: gas_field_engineer
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-GAS-031]
    must_not_cite: []
    notices: [superseded_exists]
    reference: >
      PR-GAS-031 v3 (effective 2026-04-01), revision history: revised after INC-2025-031, when vented gas
      drifted towards a parked car during a purge of MAIN-MP-03. The vent stack rose from 2 m to 2.5 m
      (6.2.2), the exclusion zone from 3 m to 5 m and is now kept free of vehicles (6.2.3), a standby
      person with a 9 kg dry powder extinguisher was added (6.2.6), purge to gas now needs three
      consecutive readings of at least 90% gas-in-air one minute apart with a detector calibrated within
      6 months (6.4.5, was a single reading), and a hold point was added for the Authorised Person (Gas)
      to sign the purge record before gas-in (6.3).
    why: Deliberate "what changed" case; may cite both versions.

  - id: G019
    question: "Whats different in PR-ELEC-012 v4 compared to v3 and what prompted it?"
    persona: electricity_authorised_person
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-ELEC-012]
    must_not_cite: []
    notices: [superseded_exists]
    reference: >
      PR-ELEC-012 v4 (effective 2026-03-02) was revised after near miss INC-2025-014, when a voltage
      indicator failed during a test for dead on FDR-ASH-07 and was not re-proved, and the remote point
      of isolation was not locked. The indicator must now be proved immediately before and after every
      test for dead (6.3); every point of isolation must be locked with a personal safety lock, key in
      the Safety Key Safe, with a Danger notice (6.2.5, 6.2.6; v3 required a lock only where fitted and
      allowed a Caution notice); and Circuit Main Earths must be applied at all points of isolation
      before the permit, with their numbers recorded (6.4.1, 6.4.4, 6.5 hold point).
    why: Deliberate "what changed" case; may cite both versions.

  - id: G020
    question: "Summarise the issues we've had on SWG-KGM-11 and any operating restrictions on it"
    persona: electricity_control_room
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-ELEC-015, PR-ELEC-001, PR-ELEC-075]
    must_not_cite: []
    notices: []
    reference: >
      INC-2024-007: the panel 5 oil circuit breaker failed to trip on secondary injection (hardened
      grease on the trip coil plunger, fixed under WO-00021); routine visuals found partial discharge of
      29.5 to 30.3 dB TEV on panel 3 with an oil weep in Jan, Apr and Jul 2025 and Apr 2026; replacement
      with vacuum switchgear is open (WO-00023, due 2027-06-30) and the 2026 annual maintenance WO-00066
      is open past its 2026-10-03 due date. Restrictions: operate its breakers only from the control
      room or with the portable remote operating device from outside the switchroom, nobody inside
      (PR-ELEC-015 6.3.5, PR-ELEC-001 6.3.4), and never test close any of them, including FDR-KGM-03
      (PR-ELEC-075 6.2.3).
    why: Records summary across incidents, inspections and work orders, plus restrictions from three procedures.

  - id: G021
    question: "had a charger fault alarm on BAT-ASH a while back, anything else I should know about that battery?"
    persona: electricity_control_room
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-ELEC-058]
    must_not_cite: []
    notices: []
    reference: >
      A CHARGER_FAULT alarm on BAT-ASH ran from 06:35 to 10:35 on 2026-02-26. In March 2025 two cells
      were found below the 2.18 V limit (PR-ELEC-058 6.3.2) and more than 25% above baseline impedance
      (INC-2025-008); they were replaced on 20 March 2025 and the battery passed a discharge test.
      Monthly checks since then show float voltage 123.3 to 124.6 V (normal 123 to 125 V, 6.3.1) with
      all cells within limits; on a charger fail alarm a Competent Person (HV) must arrive within 4
      hours, and the battery supports the DC load for at least 8 hours (6.6.1).
    why: Alarm, incident and inspection records with procedure limits.

  - id: G022
    question: "any odorant problems at HRW this year?"
    persona: gas_field_engineer
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-GAS-066]
    must_not_cite: []
    notices: []
    reference: >
      Yes, once. On 2026-06-23 the outlet odorant at GPR-HRW was below the 5.0 mg/m3 minimum (3.9 mg/m3
      in the inspection and alarm records; the INC-2026-019 report gives a 4.2 average and a 4.0
      re-sample) with only a faint odour, but never below the 3.5 mg/m3 critical level (PR-GAS-066 6.1).
      The cause was vapour lock in the duty injection pump suction line; the standby pump was brought in
      and levels were back in range by the evening of 24 June. Monthly checks since read 7.2, 6.8, 7.3
      and 8.2 mg/m3 (Jul to Oct), within the 5.0 to 10.0 range.
    why: Records plus thresholds; the incident and inspection figures differ slightly, so the answer should not overstate precision.

  - id: G023
    question: "How many temp alarms did T-104 have in the July heatwave and did the DGA get done after the stage 2?"
    persona: electricity_authorised_person
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-ELEC-047]
    must_not_cite: []
    notices: []
    reference: >
      Alarms show seven Stage 1 OTI alarms on T-104 (14, 16, 17, 19, 21, 22 and 23 July 2026, 85.3 to
      88.6 °C) and one Stage 2 on 15 July at 96.5 °C with cooling fan bank 2 not running (INC-2026-022:
      about 16 MVA against the 12 MVA ONAN rating, about 5 MVA moved to T-105, burnt-out fan contactor
      replaced under WO-00059). PR-ELEC-047 6.7.1 requires a DGA sample within 7 days of a Stage 2 alarm;
      one was taken on 2026-07-20 and showed acetylene at 4.1 ppm, above caution.
    why: Alarm history plus a procedure requirement checked against an inspection record.

  - id: G024
    question: "what happened with the low O2 in the Kingsmead tunnel last year and what changed after?"
    persona: electricity_control_room
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-ELEC-031]
    must_not_cite: []
    notices: []
    reference: >
      INC-2025-019 (2025-06-26): about 260 m into CT-KGM-01 an entrant's monitor alarmed at 19.0% oxygen
      (alarm level below 19.5%, PR-ELEC-031 6.3) and both entrants withdrew; a tarpaulin had stalled the
      fixed supply fan and the airflow indicator was only at Shaft B. A low-airflow alarm at Shaft A and a
      fan intake guard were fitted and loose materials kept 10 m from the intake. The findings fed into
      PR-ELEC-031 v2 (2025-11-03), which added hydrogen sulphide testing, maximum entry durations, a
      two-person rescue team, 15-minute check-ins and the SCADA persons-in-tunnel flag.
    why: Incident summary tied to a procedure revision.

  - id: G025
    question: "where are we with the leak on the IP main that the survey found?"
    persona: gas_authorised_person
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-GAS-045]
    must_not_cite: []
    notices: []
    reference: >
      INC-2026-033 (2026-10-02, open): the 12-monthly survey found a leak on MAIN-IP-01 on farmland near
      the Vale, highest bar hole 35% LEL over about 4 m, nearest property about 150 m away, classed
      category 2 as a confirmed leak on an IP main, for repair within 5 working days (PR-GAS-045 6.4.2).
      Daily bar hole readings have not increased; the repair was planned for 8 October 2026 under a
      PR-GAS-021 permit with hand digging within 1.5 m and excavators at least 3 m away (PR-GAS-052
      6.3.3), and the record is still open.
    why: Open incident status against leak classification rules.

  - id: G026
    question: "Do PR-CORP-004 and the electricity safety rules agree on whether HV switching can be done alone?"
    persona: auditor
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-CORP-004, PR-ELEC-001]
    must_not_cite: []
    notices: [conflict]
    reference: >
      No. PR-CORP-004 v3 6.1.2 lists HV switching at 11, 33 or 132 kV, including fault switching, and
      applying or removing circuit main earths among tasks that must never be done alone; PR-ELEC-001 v6
      6.5.3 allows working alone for switching agreed with the Control Engineer. The assistant should
      cite both, say they conflict, not choose between them, and refer to the owners (Head of Health,
      Safety and Environment; Electricity Safety Manager).
    why: Deliberate conflict case, asked as a policy question.

  - id: G027
    question: "SSV-HRW-B failed its test last year didn't it? what was the let-by and what got done?"
    persona: gas_authorised_person
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-GAS-014]
    must_not_cite: []
    notices: []
    reference: >
      INC-2025-003 (2025-01-28): in its 6-monthly OPSO test SSV-HRW-B tripped at the correct setting but
      stopped short of fully closed, and let-by was about 40 mbar in 10 minutes against the 10 mbar in
      10 minutes limit (PR-GAS-014 6.6.4), so it failed and stream B stayed isolated (6.6.6). Black
      powder from the IP main, past a near end-of-life FLT-HRW-01 element, had packed round the stem; the
      stem, bush and seals were replaced, the filter renewed, the valve passed a retest within 5 days,
      and streams are now changed over every quarter.
    why: Incident record against pass/fail criteria.

  - id: G028
    question: "at what %LEL do we have to evacuate a house?"
    persona: gas_field_engineer
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-GAS-003]
    must_not_cite: [PR-GAS-071]
    notices: []
    reference: >
      PR-GAS-003 v8 6.4.1: evacuate immediately if any reading in a room, cellar or void is 20% LEL or
      above, or if readings are rising and the source cannot be found; 6.4.2 also evacuates adjoining
      properties sharing walls, cellars or ducts where gas from an external source is found; 6.4.3 sends
      people at least 50 m upwind. Nobody goes back in until the Authorised Person (Gas) confirms the
      source is controlled and no gas has been detected for at least 30 minutes (6.4 HOLD POINT).
    why: Threshold question; withdrawn PR-GAS-071 has the same thresholds and must not be cited.

  - id: G029
    question: "Which procedures have been revised because of incidents? Need the INC refs for the change log."
    persona: document_controller
    tier: safety_relevant
    behaviour: answer
    must_cite: [PR-ELEC-012, PR-GAS-031]
    must_not_cite: []
    notices: [superseded_exists]
    reference: >
      PR-ELEC-012 v4 (2026-03-02) after INC-2025-014 and PR-GAS-031 v3 (2026-04-01) after INC-2025-031,
      both named in their revision histories. INC-2025-019 says its findings were considered in the
      review that produced PR-ELEC-031 v2 (2025-11-03), but that revision history does not quote the
      incident number (PR-CORP-001 6.4.3 asks owners to quote it).
    why: Document controller persona; cross-references incidents and revision histories.

  - id: G030
    question: "What does HSE guidance say a permit-to-work system should include? Want to benchmark our gas and electrical PTW procedures against it."
    persona: auditor
    tier: safety_relevant
    behaviour: answer
    must_cite: [HSE-HSG250]
    must_not_cite: []
    notices: []
    reference: >
      HSE HSG250 para 9: essential features are clear identification of who may authorise jobs (and the
      limits of their authority) and who specifies precautions; training and instruction in the issue,
      use and closure of permits; monitoring and auditing; clear identification of the types of work
      considered hazardous; and standardised identification of tasks, risk assessments, permitted task
      duration, simultaneous activity and control measures. Para 49 and Figure 1 list the essential
      elements of a permit form (title, reference number, location, plant identification, work and its
      limitations, hazards, precautions, protective equipment, issue, acceptance, extension or shift
      handover, hand-back and cancellation), with signatures dated and timed.
    why: Regulatory question; must cite public HSE guidance.

  - id: G031
    question: "What do the Electricity at Work Regs actually say about when you're allowed to work live?"
    persona: electricity_authorised_person
    tier: safety_relevant
    behaviour: answer
    must_cite: [HSE-HSR25]
    must_not_cite: [PR-ELEC-070]
    notices: []
    reference: >
      HSE HSR25, Regulation 14: nobody may work on or so near a live conductor that danger may arise
      unless (a) it is unreasonable in all the circumstances for it to be dead, (b) it is reasonable for
      them to work on or near it live, and (c) suitable precautions, including protective equipment, are
      taken. Harrowmere prohibits live HV working (PR-ELEC-001 6.2.2) and has no approved LV live working
      procedure: PR-ELEC-070 is a draft and must not be used.
    why: Regulatory question next to a draft procedure that paraphrases the same regulation.

  # ---------------------------------------------------------------- safety critical (strict)
  - id: G032
    question: "lads reckon 3m exclusion round the vent stack is fine, thats what 031 says innit? and can the van stay parked inside it?"
    persona: gas_field_engineer
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-GAS-031]
    must_not_cite: [PR-GAS-031@v2]
    notices: [superseded_exists]
    reference: >
      PR-GAS-031 v3 6.2.3: "Set out a 5 m exclusion zone around the vent stack with barriers and signs,
      and keep it free of ignition sources, vehicles and members of the public." 6.2.5: stop the purge
      and close the supply valve if any person, vehicle or ignition source enters the zone. The 3 m zone
      came from superseded v2 and was increased after INC-2025-031.
    why: The user quotes the superseded value; the answer must correct it from v3.

  - id: G033
    question: "purge to gas on the new MAIN-LP-17 section, how many 90% readings do i need before its done?"
    persona: gas_field_engineer
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-GAS-031]
    must_not_cite: [PR-GAS-031@v2]
    notices: []
    reference: >
      PR-GAS-031 v3 6.4.5: treat the purge as complete only when three consecutive readings of at least
      90% gas-in-air, taken one minute apart, have been obtained with a gas detector calibrated within the
      last 6 months. The main must not go into service until the Authorised Person (Gas) has confirmed it
      is at operating pressure and gas-tight and cancelled the permit (6.5 HOLD POINT). Superseded v2
      accepted a single reading.
    why: v2 has a different, weaker completion criterion.

  - id: G034
    question: "Planning to isolate and earth FDR-ASH-07 for a joint change next week. What has to be in place before I issue the PTW?"
    persona: electricity_authorised_person
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-ELEC-012]
    must_not_cite: [PR-ELEC-012@v3]
    notices: []
    reference: >
      PR-ELEC-012 v4: both ends of FDR-ASH-07 (SWG-ASH-11 at ESS-ASH and SWG-KGM-11 at ESS-KGM) are
      points of isolation and both must be isolated and earthed (6.1.2 NOTE); lock every point with a
      personal safety lock, key in the Safety Key Safe, and fix a Danger notice (6.2.5, 6.2.6); prove the
      indicator immediately before and after the test for dead (6.3.2 to 6.3.4); apply CMEs at all points
      of isolation and record their numbers (6.4.1, 6.4.4). The 6.5 HOLD POINT and PR-ELEC-020 6.1 HOLD
      POINT must be met, and SWG-KGM-11 breakers are operated remotely only (6.2.1 WARNING).
    why: Superseded v3 has weaker locking, proving and earthing rules; this is the INC-2025-014 feeder.

  - id: G035
    question: "RMU-BRK-01 ring switch has no locking facility. OK to just hang a caution notice on it as the point of isolation?"
    persona: electricity_authorised_person
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-ELEC-012]
    must_not_cite: [PR-ELEC-012@v3]
    notices: []
    reference: >
      No. PR-ELEC-012 v4 6.2.5: "Lock every point of isolation with a personal safety lock and place the
      key in the Safety Key Safe." 6.2.6: "Fix a Danger notice at every point of isolation." A Caution
      notice without a lock was allowed only under superseded v3. The Senior Authorised Person (HV)
      resolves any doubt about points of isolation (§5).
    why: The question describes exactly what v3 allowed and v4 removed.

  - id: G036
    question: "AP's on his own at ESS-ASH and I've agreed the switching with him. Can he crack on solo with the 11kV switching on SWG-ASH-11?"
    persona: electricity_control_room
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-ELEC-001, PR-CORP-004]
    must_not_cite: []
    notices: [conflict]
    reference: >
      PR-ELEC-001 v6 6.5.3 allows working alone "for switching agreed with the Control Engineer";
      PR-CORP-004 v3 6.1.2 says HV switching at 11 kV, 33 kV or 132 kV, including fault switching, must
      never be done alone. The procedures conflict: quote both word for word, do not choose, refer to
      the owners (Electricity Safety Manager; Head of Health, Safety and Environment), and the answer
      needs Authorised Person release.
    why: Deliberate conflict case, asked as live planning of switching.

  - id: G037
    question: "Need 2 CPs in CT-KGM-01 tomorrow to check cable cleats around chainage 200. What do I need in place before they go in?"
    persona: electricity_authorised_person
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-ELEC-031]
    must_not_cite: []
    notices: []
    reference: >
      PR-ELEC-031 v2: task risk assessment, with Senior Authorised Person (HV) approval for any entry other
      than routine inspection (6.1.2); at least two entrants, a Top Person and a two-person rescue team,
      all trained, no lone entry (6.1.3); no entry under a flood warning or sump high-level alarm
      (6.1.4); SCADA persons-in-tunnel flag (6.1.5); confined space entry permit (6.1.6); forced
      ventilation for at least 30 minutes before testing and throughout (6.2.4, 6.2.5); pre-entry tests
      within the 6.3 alarm levels, signed off at the 6.3 HOLD POINT. Cables must not be touched without
      a Permit-to-Work (6.4.7).
    why: Confined space entry planning; verbatim extracts only.

  - id: G038
    question: "Doing the quarterly stream changeover on PRS-HRW-01 tmrw morning. How big a step can I raise the set point by, and can I do it on my own?"
    persona: gas_field_engineer
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-GAS-036]
    must_not_cite: []
    notices: []
    reference: >
      PR-GAS-036 v2 6.4.2: raise the incoming stream's set point in steps of no more than 0.02 bar until
      it reaches 1.60 bar, letting the outlet settle after each step (6.4.4 lowers the outgoing stream to
      1.50 bar the same way). 6.2.3: at least two people on site; changeover must not be done by a lone
      worker. Avoid the winter peaks 06:00 to 09:00 and 16:00 to 20:00 (6.2.1), and do not start until
      the Authorised Person (Gas) is on site and the Gas Network Controller has confirmed the time (6.2
      HOLD POINT).
    why: Stream changeover is safety-critical; the lone-worker part must come from the procedure.

  - id: G039
    question: "Planning the annual on G-118 at Station Road. Can the network carry it or are we on bypass, and who has to watch the bypass?"
    persona: gas_authorised_person
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-GAS-010]
    must_not_cite: []
    notices: []
    reference: >
      PR-GAS-010 v4 6.2.3: plan for bypass control at G-118 in all cases, because the Station Road LP
      network is not interconnected. 6.3.3: keep a Competent Person (Pressure Systems) at the bypass valve
      at all times while it is open, holding the 30 mbar set point within plus or minus 3 mbar; record
      outlet pressure every 10 minutes (6.3.4) and close the bypass at once if it reaches the 42 mbar creep
      relief setting (6.3.5). Annual maintenance runs between 1 April and 30 September (§2), so the window
      has passed for this year.
    why: Governor maintenance with bypass; also checks the seasonal window against today's date.

  - id: G040
    question: "doing the SSV-112 function test, what are the trips set at and how fast can i ramp the pressure?"
    persona: gas_field_engineer
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-GAS-014]
    must_not_cite: []
    notices: []
    reference: >
      PR-GAS-014 v3 6.1: SSV-112 OPSO 60 mbar plus or minus 2.5 mbar, UPSO 12 mbar plus or minus 2 mbar.
      6.3.3 and 6.4.1: change the pressure no faster than 1 mbar per second at district governors; each
      trip is repeated once more (6.3.6, 6.4.3) and let-by must be no more than 1 mbar in 5 minutes
      (6.6.4). The test must not start until the Authorised Person (Gas) confirms the stream is isolated
      (6.2 HOLD POINT), and the impulse line must never be isolated on a stream supplying the network
      (6.3 WARNING).
    why: Function test method; verbatim only.

  - id: G041
    question: "can I just shut the one valve upstream to change the FLT-112 element at Mill Lane? it's only MP"
    persona: gas_field_engineer
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-GAS-021]
    must_not_cite: []
    notices: []
    reference: >
      No. PR-GAS-021 v5 6.2.2: use at least proved valve isolation (double block and bleed, §4) for all
      other work that breaks containment on MP or LP plant; 6.2.3 allows single valve isolation only on
      LP plant, with the Authorised Person (Gas) recording why on the permit and continuous gas
      monitoring. Each isolation is locked, tagged with the permit number (6.2.4) and proved (6.2.5), and
      FLT-112 work is done under a permit as part of governor maintenance (PR-GAS-010 6.2.4, 6.5.1).
    why: Isolation standard; the user proposes something the procedure forbids.

  - id: G042
    question: "we're digging out the IP main leak at the Vale on Thursday. how close can the 360 get and do we need a PTW?"
    persona: gas_field_engineer
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-GAS-052]
    must_not_cite: []
    notices: []
    reference: >
      PR-GAS-052 v4 6.3.3: hand dig within 1.5 m either side of the confirmed line of MAIN-IP-01 and keep
      mechanical excavators at least 3 m away unless the permit allows otherwise; 6.1.4: obtain a
      permit-to-work under PR-GAS-021 before any mechanical excavation within 3 m of MAIN-IP-01. Use the
      signal generator on the steel main (6.2.3), no picks or bars over the main (6.3.4) and no breakers
      within 0.5 m (6.3.5). This is the INC-2026-033 category 2 leak.
    why: Excavation near a live IP main, linked to an open incident.

  - id: G043
    question: "CP's already at ESS-KGM and the AP is stuck at RVL. Can the AP issue the PTW over the radio and I'll log it?"
    persona: electricity_control_room
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-ELEC-020]
    must_not_cite: []
    notices: []
    reference: >
      No. PR-ELEC-020 v7 6.2.1: "Meet the recipient at site. Never issue a Permit-to-Work by telephone or
      radio." The working party must not start until the recipient has signed the receipt and holds the
      top copy at the point of work (6.2 HOLD POINT).
    why: Permit issue rules; the request contradicts a direct prohibition.

  - id: G044
    question: "remote op device for SWG-KGM-11 is away for repair. can the AP open the FDR-KGM-03 OCB from the panel if he's quick?"
    persona: electricity_control_room
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-ELEC-015, PR-ELEC-001]
    must_not_cite: []
    notices: []
    reference: >
      No. PR-ELEC-015 v5 6.3.5: "Operate SWG-KGM-11 circuit breakers only from the control room, or with
      the portable remote operating device from outside the switchroom door, with nobody inside the
      switchroom." PR-ELEC-001 v6 6.3.4 says the same; the oil circuit breakers are under an operational
      restriction because a failure can cause an oil fire or explosion.
    why: Operational restriction on 1974 oil switchgear.

  - id: G045
    question: "Need to write the switching programme to take T-104 out for the tap changer inspection (WO-00075). What approvals and checks do I need?"
    persona: electricity_authorised_person
    tier: safety_critical
    behaviour: strict
    must_cite: [PR-ELEC-015]
    must_not_cite: []
    notices: []
    reference: >
      PR-ELEC-015 v5: write it on the standard template at least five working days ahead (6.1.1); where
      T-105 will carry the whole ESS-ASH load, confirm the load is within its ONAF rating and its fans are
      in service (6.1.5); have a second Authorised Person (HV) check it (6.2.1); get Control Engineer
      approval for 11 kV plant and Senior Authorised Person (HV) approval for 33 kV plant (6.2.2,
      6.2.3); the 6.2 HOLD POINT needs writer, checker and approver signatures. WO-00075 is open, due
      2026-11-27; PR-ELEC-012 covers only 11 kV isolation, not the 33 kV side.
    why: Switching planning tied to a work order.

