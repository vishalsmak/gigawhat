services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: gigawhat
      POSTGRES_PASSWORD: gigawhat
      POSTGRES_DB: gigawhat_cloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigawhat -d gigawhat_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
